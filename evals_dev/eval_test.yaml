description: "Output Evaluation"

providers:
  - id: openrouter:openai/gpt-5-nano
    config:
      temperature: 0
      max_tokens: 8192

defaultTest:
  options:
    provider: openrouter:openai/gpt-5-nano

prompts:
  - "{{user_prompt}}"

tests:
  - description: 'Test evaluation functionality'
    vars:
      #system_prompt: file://systemprompt
      user_prompt: file://userprompt.md
      eval_prompt: file://evalprompt.md
    assert:
      - type: llm-rubric
        value: "{{eval_prompt}}"
