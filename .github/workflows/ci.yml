name: Python CLI smoke check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project dependencies
        if: "true"
        run: uv sync --locked
      - name: Run repository validation
        run: uv run python -m compileall -q main.py src

